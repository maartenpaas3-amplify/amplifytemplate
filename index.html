<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amplify Menu Engine</title>
    <!--
      Default fonts for the boilerplate. brand.config.ts references
      'Fraunces' (display) and 'Inter' (body) by name, but a font name in
      CSS does nothing without the font file actually being loaded — that
      is what this link does. IMPORTANT: if you change displayFont/bodyFont
      in brand.config.ts for a client, you MUST update this link to match,
      otherwise the browser silently falls back to a system font and the
      site looks generic no matter what the config says.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
