<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amplify Menu Engine</title>
    <!--
      Default fonts for the boilerplate. brand.config.ts references
      'Bodoni Moda' (display) and 'Inter' (body) by name, but a font name in
      CSS does nothing without the font file actually being loaded — that
      is what this link does. IMPORTANT: if you change displayFont/bodyFont
      in brand.config.ts for a client, you MUST update this link to match,
      otherwise the browser silently falls back to a system font and the
      site looks generic no matter what the config says.

      Bodoni Moda replaced Fraunces as the studio default: Fraunces has a
      soft, rounded, "artisanal bakery" character that undersold the
      high-end/formal register most clients are actually going for. Bodoni
      Moda's straighter stems and higher contrast read as more confident
      and expensive at headline size, without the italic-leaning warmth of
      the previous choice. Compared side by side with the studio's own
      hero copy before switching every project over.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
